<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e8edf0"/>
      <stop offset="100%" stop-color="#b8c6d1"/>
    </linearGradient>
    <linearGradient id="riceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#fdfbf5"/>
      <stop offset="100%" stop-color="#eee6d3"/>
    </linearGradient>
    <linearGradient id="chopGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfa973"/>
      <stop offset="100%" stop-color="#8c531b"/>
    </linearGradient>
  </defs>

  <!-- 배경 원 (은은한 시골 햇살 톤) -->
  <circle cx="32" cy="32" r="30" fill="#fcf8ed" stroke="#dfcfbc" stroke-width="2"/>

  <!-- 고봉 밥알 돔 (쌀밥) -->
  <path d="M 12 36 Q 16 16 32 15 Q 48 16 52 36 Z" fill="url(#riceGrad)" stroke="#dcd3bf" stroke-width="1.5"/>
  
  <!-- 밥알 디테일 텍스처 -->
  <ellipse cx="26" cy="22" rx="4" ry="2" fill="#ffffff" transform="rotate(-15 26 22)"/>
  <ellipse cx="38" cy="21" rx="4" ry="2" fill="#ffffff" transform="rotate(20 38 21)"/>
  <ellipse cx="32" cy="28" rx="4" ry="2" fill="#ffffff" transform="rotate(-5 32 28)"/>
  <ellipse cx="20" cy="30" rx="3.5" ry="1.8" fill="#ffffff" transform="rotate(30 20 30)"/>
  <ellipse cx="44" cy="29" rx="3.5" ry="1.8" fill="#ffffff" transform="rotate(-25 44 29)"/>

  <!-- 사기 밥그릇 -->
  <path d="M 10 35 Q 12 52 32 53 Q 52 52 54 35 Z" fill="url(#bowlGrad)" stroke="#9fb0bf" stroke-width="1.8"/>
  <ellipse cx="32" cy="35" rx="22" ry="3.5" fill="#eef2f5" stroke="#b4c2ce" stroke-width="1"/>
  <!-- 청화 문양 띠 -->
  <path d="M 17 44 Q 32 49 47 44" fill="none" stroke="#4a77a3" stroke-width="2" stroke-linecap="round"/>
  <!-- 밥그릇 굽(받침) -->
  <ellipse cx="32" cy="53" rx="10" ry="2" fill="#9fb0bf"/>

  <!-- 나무 젓가락 (오른쪽 위에서 밥을 향해 비스듬히 꽂힌 모습) -->
  <polygon points="34,22 36,20 58,2 56,1" fill="url(#chopGrad)"/>
  <polygon points="38,25 40,23 62,5 60,4" fill="url(#chopGrad)"/>
</svg>
